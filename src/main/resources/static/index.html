<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background: #f5f5f3;
          color: #1a1a1a;
          min-height: 100vh;
        }

        /* navbar */
        nav {
          background: #fff;
          border-bottom: 1px solid #e5e5e5;
          padding: 0 2rem;
          height: 56px;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        nav .logo {
          font-size: 18px;
          font-weight: 600;
          color: #1a1a1a;
          display: flex;
          align-items: center;
          gap: 8px;
          text-decoration: none;
        }
        nav .logo i { font-size: 22px; color: #4f46e5; }

        /* hero */
        .hero {
          text-align: center;
          padding: 4rem 1rem 2.5rem;
        }
        .hero h1 {
          font-size: 36px;
          font-weight: 700;
          color: #1a1a1a;
          margin-bottom: 0.75rem;
        }
        .hero h1 span { color: #4f46e5; }
        .hero p {
          font-size: 16px;
          color: #6b6b6b;
        }

        /* main box */
        .box {
          background: #fff;
          border: 1px solid #e5e5e5;
          border-radius: 16px;
          padding: 2rem;
          max-width: 680px;
          margin: 0 auto;
        }

        .input-row {
          display: flex;
          gap: 8px;
        }
        .input-row input[type="text"] {
          flex: 1;
          height: 48px;
          padding: 0 16px;
          font-size: 15px;
          border: 1px solid #e0e0e0;
          border-radius: 10px;
          outline: none;
          color: #1a1a1a;
          background: #fff;
          transition: border-color 0.15s, box-shadow 0.15s;
        }
        .input-row input[type="text"]:focus {
          border-color: #4f46e5;
          box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
        }
        .btn-primary {
          height: 48px;
          padding: 0 24px;
          font-size: 15px;
          font-weight: 600;
          background: #4f46e5;
          color: #fff;
          border: none;
          border-radius: 10px;
          cursor: pointer;
          white-space: nowrap;
          transition: background 0.15s, opacity 0.15s;
        }
        .btn-primary:hover { background: #4338ca; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        /* options */
        .options-row {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-top: 14px;
        }
        .options-row label {
          font-size: 13px;
          color: #6b6b6b;
          display: flex;
          align-items: center;
          gap: 5px;
        }
        .options-row input[type="number"] {
          width: 72px;
          height: 34px;
          padding: 0 10px;
          font-size: 13px;
          border: 1px solid #e0e0e0;
          border-radius: 8px;
          color: #1a1a1a;
          background: #fff;
          outline: none;
        }
        .options-row input[type="number"]:focus {
          border-color: #4f46e5;
          box-shadow: 0 0 0 2px rgba(79,70,229,0.1);
        }
        .options-hint {
          font-size: 12px;
          color: #aaa;
        }

        /* error */
        .error-msg {
          margin-top: 12px;
          font-size: 13px;
          color: #dc2626;
          display: none;
          align-items: center;
          gap: 6px;
        }

        /* result */
        .result-card {
          margin-top: 20px;
          background: #f0f0ff;
          border: 1px solid #c7c4f8;
          border-radius: 12px;
          padding: 1.25rem 1.5rem;
          display: none;
        }
        .result-label {
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          color: #6b6b6b;
          margin-bottom: 8px;
        }
        .result-url-row {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .short-url {
          font-size: 22px;
          font-weight: 700;
          color: #4f46e5;
          text-decoration: none;
          flex: 1;
          word-break: break-all;
        }
        .short-url:hover { text-decoration: underline; }

        .btn-copy {
          height: 36px;
          padding: 0 16px;
          font-size: 13px;
          font-weight: 500;
          border: 1px solid #c7c4f8;
          border-radius: 8px;
          background: #fff;
          color: #4f46e5;
          cursor: pointer;
          display: flex;
          align-items: center;
          gap: 6px;
          white-space: nowrap;
          transition: background 0.15s;
        }
        .btn-copy:hover { background: #eeeeff; }
        .btn-copy.copied { background: #eefaf3; color: #16a34a; border-color: #bbf0d5; }

        .original-url {
          font-size: 12px;
          color: #888;
          margin-top: 10px;
          word-break: break-all;
        }

        /* stats pills */
        .stats-row {
          display: flex;
          gap: 10px;
          margin-top: 14px;
          flex-wrap: wrap;
        }
        .stat-pill {
          background: #fff;
          border: 1px solid #e0e0e0;
          border-radius: 20px;
          padding: 5px 14px;
          font-size: 13px;
          color: #6b6b6b;
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .stat-pill i { font-size: 14px; }
        .stat-pill span { color: #1a1a1a; font-weight: 500; }

        /* history */
        .history-section {
          max-width: 680px;
          margin: 1.5rem auto 0;
          padding-bottom: 4rem;
        }
        .history-title {
          font-size: 13px;
          color: #aaa;
          margin-bottom: 10px;
          padding-left: 2px;
        }
        .history-list {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        .history-item {
          background: #fff;
          border: 1px solid #e5e5e5;
          border-radius: 10px;
          padding: 10px 14px;
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .history-short {
          font-size: 14px;
          font-weight: 600;
          color: #4f46e5;
          text-decoration: none;
          white-space: nowrap;
        }
        .history-short:hover { text-decoration: underline; }
        .history-long {
          font-size: 13px;
          color: #aaa;
          flex: 1;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .history-copy-btn {
          border: none;
          background: none;
          cursor: pointer;
          color: #ccc;
          padding: 4px 6px;
          border-radius: 6px;
          display: flex;
          align-items: center;
          transition: color 0.15s, background 0.15s;
        }
        .history-copy-btn:hover { color: #4f46e5; background: #f0f0ff; }
        .history-copy-btn i { font-size: 16px; }

        /* padding wrapper */
        .page-wrap {
          max-width: 680px;
          margin: 0 auto;
          padding: 0 1rem;
        }
    </style>
</head>
<body>

<nav>
    <a class="logo" href="/">
        <i class="ti ti-link"></i>
        Shortly
    </a>
</nav>

<div class="hero">
    <h1>Shorten your <span>links</span></h1>
    <p>Paste a long URL below and get a clean, short link in seconds</p>
</div>

<div class="page-wrap">
    <div class="box">
        <div class="input-row">
            <input type="text" id="longUrl" placeholder="https://your-very-long-url.com/paste/here" />
            <button class="btn-primary" id="shortenBtn" onclick="shortenUrl()">
                <i class="ti ti-scissors" style="font-size:16px; vertical-align:-2px; margin-right:4px;"></i>Shorten
            </button>
        </div>

        <div class="options-row">
            <label for="ttlDays">
                <i class="ti ti-clock" style="font-size:15px;"></i>
                Expires in
            </label>
            <input type="number" id="ttlDays" placeholder="days" min="1" max="365" />
            <span class="options-hint">days (leave blank = never)</span>
        </div>

        <div class="error-msg" id="errorMsg">
            <i class="ti ti-alert-circle" style="font-size:15px;"></i>
            <span id="errorText"></span>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-label">your short link</div>
            <div class="result-url-row">
                <a class="short-url" id="shortUrlLink" href="#" target="_blank"></a>
                <button class="btn-copy" id="copyBtn" onclick="copyUrl()">
                    <i class="ti ti-copy" style="font-size:15px;"></i> Copy
                </button>
            </div>
            <div class="original-url" id="originalUrlDisplay"></div>
            <div class="stats-row" id="statsRow" style="display:none;">
                <div class="stat-pill">
                    <i class="ti ti-calendar"></i> Created <span id="statCreated">—</span>
                </div>
                <div class="stat-pill">
                    <i class="ti ti-clock"></i> Expires <span id="statExpires">never</span>
                </div>
                <div class="stat-pill">
                    <i class="ti ti-mouse"></i> Clicks <span id="statClicks">0</span>
                </div>
            </div>
        </div>
    </div>

    <div class="history-section" id="historySection" style="display:none;">
        <div class="history-title">Recent links</div>
        <div class="history-list" id="historyList"></div>
    </div>
</div>

<script>
    const API_BASE = 'https://url-shortener-tqhw.onrender.com';;
    let history = [];
    let currentShortUrl = '';

    async function shortenUrl() {
      const longUrl = document.getElementById('longUrl').value.trim();
      const ttlDays = document.getElementById('ttlDays').value;
      const btn = document.getElementById('shortenBtn');

      if (!longUrl) { showError('Please enter a URL'); return; }
      if (!longUrl.startsWith('http://') && !longUrl.startsWith('https://')) {
        showError('URL must start with http:// or https://');
        return;
      }

      hideError();
      btn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader" style="font-size:16px; vertical-align:-2px; margin-right:4px;"></i>Shortening...';

      const body = { longUrl };
      if (ttlDays) body.ttlDays = parseInt(ttlDays);

      try {
        const res = await fetch(`${API_BASE}/api/shorten`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.message || 'Something went wrong');
          return;
        }

        currentShortUrl = data.shortUrl;
        showResult(data);
        addToHistory(data);
        fetchStats(data.shortUrl);

      } catch (e) {
        showError('Cannot connect to server. Make sure Spring Boot is running on port 8080.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-scissors" style="font-size:16px; vertical-align:-2px; margin-right:4px;"></i>Shorten';
      }
    }

    function showResult(data) {
      const card = document.getElementById('resultCard');
      document.getElementById('shortUrlLink').textContent = data.shortUrl;
      document.getElementById('shortUrlLink').href = data.shortUrl;
      document.getElementById('originalUrlDisplay').textContent = '↳ ' + data.longUrl;
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.className = 'btn-copy';
      copyBtn.innerHTML = '<i class="ti ti-copy" style="font-size:15px;"></i> Copy';
      document.getElementById('statsRow').style.display = 'none';
      card.style.display = 'block';
    }

    async function fetchStats(shortUrl) {
      const code = shortUrl.split('/').pop();
      try {
        const res = await fetch(`${API_BASE}/api/stats/${code}`);
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('statCreated').textContent =
          new Date(data.createdAt).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
        document.getElementById('statExpires').textContent =
          data.expiresAt
            ? new Date(data.expiresAt).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' })
            : 'never';
        document.getElementById('statClicks').textContent = data.hitCount;
        document.getElementById('statsRow').style.display = 'flex';
      } catch(e) {}
    }

    function copyUrl() {
      navigator.clipboard.writeText(currentShortUrl).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.className = 'btn-copy copied';
        btn.innerHTML = '<i class="ti ti-check" style="font-size:15px;"></i> Copied!';
        setTimeout(() => {
          btn.className = 'btn-copy';
          btn.innerHTML = '<i class="ti ti-copy" style="font-size:15px;"></i> Copy';
        }, 2000);
      });
    }

    function addToHistory(data) {
      history.unshift(data);
      if (history.length > 5) history.pop();
      renderHistory();
    }

    function renderHistory() {
      const section = document.getElementById('historySection');
      const list = document.getElementById('historyList');
      if (history.length === 0) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      list.innerHTML = history.map(item => `
        <div class="history-item">
          <a class="history-short" href="${item.shortUrl}" target="_blank">${item.shortUrl}</a>
          <span class="history-long" title="${item.longUrl}">${item.longUrl}</span>
          <button class="history-copy-btn" onclick="copyHistoryUrl('${item.shortUrl}', this)" aria-label="Copy">
            <i class="ti ti-copy"></i>
          </button>
        </div>
      `).join('');
    }

    function copyHistoryUrl(url, btn) {
      navigator.clipboard.writeText(url).then(() => {
        btn.innerHTML = '<i class="ti ti-check" style="font-size:16px; color:#16a34a;"></i>';
        setTimeout(() => {
          btn.innerHTML = '<i class="ti ti-copy" style="font-size:16px;"></i>';
        }, 2000);
      });
    }

    function showError(msg) {
      document.getElementById('errorText').textContent = msg;
      document.getElementById('errorMsg').style.display = 'flex';
    }

    function hideError() {
      document.getElementById('errorMsg').style.display = 'none';
    }

    document.getElementById('longUrl').addEventListener('keydown', e => {
      if (e.key === 'Enter') shortenUrl();
    });
</script>

</body>
</html>
